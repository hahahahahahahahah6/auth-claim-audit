[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "auth-claim-audit"
version = "0.1.0"
description = "Offline audit of documentation credential claims against Python evidence"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "auth-claim-audit contributors"}]
dependencies = []

[project.scripts]
auth-claim-audit = "auth_claim_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
